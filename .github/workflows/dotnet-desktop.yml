name: TimeTask CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    env:
      Solution_Name: TimeTask.sln
      Main_Project_Path: TimeTask.csproj
      Test_Project_Path: TimeTask.Tests/TimeTask.Tests.csproj
      Build_Configuration: Release
      Build_Platform: AnyCPU
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Setup .NET SDK (test project toolchain)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore main project
      run: msbuild $env:Main_Project_Path /t:Restore /p:Configuration=$env:Build_Configuration /p:Platform=$env:Build_Platform

    - name: Build main project
      run: msbuild $env:Main_Project_Path /p:Configuration=$env:Build_Configuration /p:Platform=$env:Build_Platform /m

    - name: Restore test project
      run: msbuild $env:Test_Project_Path /t:Restore /p:Configuration=$env:Build_Configuration

    - name: Build test project
      run: msbuild $env:Test_Project_Path /p:Configuration=$env:Build_Configuration /p:Platform="AnyCPU" /m

    - name: Run unit tests
      run: dotnet test $env:Test_Project_Path -c $env:Build_Configuration --no-build --logger "console;verbosity=normal"

    # 编码门禁：拦截 U+FFFD 乱码 / 非法 UTF-8 / bat 中文 / ps1 缺 BOM（本项目历史顽疾）
    - name: Encoding guard (full repo scan)
      shell: pwsh
      run: |
        $enc = Join-Path $env:GITHUB_WORKSPACE 'scripts\check_encoding.ps1'
        & powershell -NoProfile -ExecutionPolicy Bypass -File $enc -Mode full -TreatWarningAsError

    # i18n 棘轮：XAML 硬编码中文只许减少不许新增（基线 docs/i18n-baseline.txt）
    - name: i18n ratchet (hardcoded CJK in XAML)
      shell: pwsh
      run: |
        $i18n = Join-Path $env:GITHUB_WORKSPACE 'scripts\check_i18n.ps1'
        & powershell -NoProfile -ExecutionPolicy Bypass -File $i18n -Ratchet docs\i18n-baseline.txt
        if ($LASTEXITCODE -ne 0) { exit 1 }
        $baseline = Join-Path $env:GITHUB_WORKSPACE 'docs\i18n-baseline.txt'
        if (git status --porcelain -- $baseline) {
          if ("$env:GITHUB_EVENT_NAME" -eq 'push') {
            "Baseline decreased - committing new baseline"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $baseline
            git commit -m "chore: lower i18n baseline [skip ci]"
            git push
          } else {
            "Baseline decreased in PR - merge will update it via the push run."
          }
        }
